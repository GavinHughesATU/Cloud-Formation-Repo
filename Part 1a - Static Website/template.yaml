AWSTemplateFormatVersion: '2010-09-09'

Description: Static website hosted on Amazon S3

Resources:

  WebsiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: gavinhughes-static-website-2026

      VersioningConfiguration:
        Status: Enabled

      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: error.html

      Tags:
        - Key: Name
          Value: GavinsStaticWebsite

        - Key: Owner
          Value: Gavin Hughes

        - Key: Project
          Value: CloudFormation

        - Key: Environment
          Value: Development

  WebsiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebsiteBucket

      PolicyDocument:
        Version: '2012-10-17'

        Statement:
          - Sid: PublicReadAccess

            Effect: Allow

            Principal: "*"

            Action:
              - s3:GetObject

            Resource:
              - !Sub '${WebsiteBucket.Arn}/*'

Outputs:

  WebsiteURL:
    Value: !GetAtt WebsiteBucket.WebsiteURL

    Description: URL of hosted website